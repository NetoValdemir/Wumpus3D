# Publica o jogo no GitHub Pages a cada push na branch main.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm run check
      # Ranking oficial: todos os agentes de agents/ em 500 mapas. Configure o segredo ARENA_SEED
      # (Settings → Secrets and variables → Actions) para a semente ficar secreta.
      - name: Ranking oficial da arena
        env:
          ARENA_SEED: ${{ secrets.ARENA_SEED }}
        run: npm run arena -- --maps 500 --seed "${ARENA_SEED:-${{ github.sha }}}" --ocultar-semente --json public/ranking.json --md public/ranking.md
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
